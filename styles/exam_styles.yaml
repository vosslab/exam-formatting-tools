fonts:
  primary: "Atkinson Hyperlegible Next"
  fallback: "Atkinson Hyperlegible Next"
  monospace: "Atkinson Hyperlegible Mono"
  monospace_fallback: "Atkinson Hyperlegible Mono"

sizes:
  normal: 10
  heading_1: 18
  heading_2: 14
  chapter_heading: 13
  # Question Heading/Follow use regular 11pt text; the number label carries
  # the visual emphasis in its own outlined character style.
  question: 11
  choice: 10
  header: 8

colors:
  heading_1: "#000000"
  chapter_heading: "#6600CC"
  table_header_bg: "#F2F2F2"

spacing:
  normal_space_after_pt: 3
  normal_line_spacing: 1.0
  # The title is the first thing on page 1 and now carries the boilerplate on
  # its own line, so it needs no lead-in space and only a thin gap below.
  heading_space_before: 0.0
  heading_space_after: 0.04
  # Question Heading indent/hanging match ARTIFACTS exam1.odt (0.2 in / -0.2 in).
  question_indent: 0.2
  question_hanging: -0.2
  # space_before 0.12 in and space_after 0.05 in mirror the artifact's
  # fo:margin-top="0.1201in" / fo:margin-bottom="0.05in" on Question Heading.
  question_heading_space_before: 0.12
  question_space_after: 0.05
  choice_indent: 0.13
  choice_first_line_indent: 0
  choice_space_before_pt: 4
  matching_prompt_indent: 0.2
  matching_prompt_hanging: -0.2
  matching_prompt_space_before: 0.07
  matching_prompt_line_spacing: 1.25
  chapter_space_before_pt: 8
  chapter_space_after_pt: 4
  header_space_after_pt: 2

borders:
  # 2pt is about 2.7px at 96dpi, matching the requested visible outline.
  question_label_width_pt: 2
  question_label_padding_pt: 2

style_flags:
  heading_1_bold: true
  heading_1_italic: false
  # The title shares its line with the name/score block, so it stays flush
  # left; centering it would drive the block off the right margin.
  heading_1_centered: false
  question_bold: false
  question_italic: false
  chapter_heading_bold: true
  heading_2_bold: true
  heading_2_italic: true
  table_header_centered: true

page:
  margin: 0.6
  header_distance: 0.5
  header_center_tab: 3.65
  header_right_tab: 7.3
  # Left edge of the first-page name/score block. The title sits flush left on
  # the same line, so the block starts far enough across that its longest line
  # ("Final Score ____ / ____ / ____ / ____ / NN pts", about 3.2 in at 10pt)
  # reaches near the 7.3 in right margin without wrapping.
  heading_block_tab: 4.0
  image_max_width: 5.6
  # The single global scale for every rendered drawing. Printed width is
  # always pixels / the PNG's own recorded resolution * this factor, with no
  # bounding box and no clamp, so two drawings that are the same size in the
  # source HTML are the same size in the DOCX. Raising or lowering it rescales
  # every drawing together and never changes their sizes relative to each
  # other. There is deliberately no configured resolution to pair with it: the
  # renderer stamps each PNG, so nothing here can drift out of sync with it.
  table_image_scale: 0.7
  choice_image_max_width: 3.40
  choice_image_max_height: 2.00
  # wide drawing choices (DNA sequence strips) are stacked at page width
  # instead of being squeezed into a 4/5-column image row
  choice_strip_max_width: 5.60
  choice_strip_min_aspect: 8.0
  # inline drawing beside a "___ N." matching prompt (pedigrees)
  prompt_image_max_height: 1.40
  # wide one-row strips (DNA sequences, aspect >= prompt_strip_min_aspect)
  # get a lower cap so short and long strips share one cell size
  prompt_strip_max_height: 0.40
  prompt_strip_min_aspect: 4.0

layout_limits:
  max_chars_5: 17
  max_chars_4: 17
  max_chars_3: 30
  max_chars_2: 49

matching_prompt_tab_stops:
  - 0.5
  - 3.5

layout_tab_stops:
  # Tab stops are pre-offset by choice_indent (0.13") so inter-column gaps
  # render evenly. OOXML tab stops are measured from page left margin, so
  # the FIRST gap (from indent to first tab) would be short by `choice_indent`
  # without this offset.
  2:
    - 3.78
  3:
    - 2.46
    - 4.80
  4:
    - 1.88
    - 3.63
    - 5.38
  5:
    - 1.53
    - 2.93
    - 4.33
    - 5.73
